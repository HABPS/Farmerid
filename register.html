<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Registration - Agri Record</title>
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="auth-wrap">
<div class="box">
<div class="hd"><h1>Naya Account / Registration</h1><p>Account banne ke baad admin approve karega, tabhi login hoga.</p></div>
<div class="bd" id="bd">
<form id="f" autocomplete="on">
<label for="name">Poora naam / Full name</label>
<input id="name" required minlength="2" autocomplete="name" placeholder="Jaise Ramesh Patil">
<label for="shop">CSC / Net cafe ka naam</label>
<input id="shop" autocomplete="organization" placeholder="Jaise Sai CSC Centre">
<label for="mobile">Mobile number</label>
<input id="mobile" inputmode="numeric" maxlength="10" required autocomplete="tel" placeholder="10 digit mobile">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="username" placeholder="aap@example.com">
<label for="pw">Password</label>
<input id="pw" type="password" required minlength="8" autocomplete="new-password" placeholder="Kam se kam 8 akshar">
<label for="pw2">Password dobara likhein</label>
<input id="pw2" type="password" required minlength="8" autocomplete="new-password">
<button class="btn" id="go" type="submit">Account banayein</button>
<div class="msg" id="msg"></div>
<div class="links"><span></span><a href="login.html">Pehle se account hai? Login</a></div>
</form>
</div>
</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function show(t,k){var m=$('msg');m.className='msg '+k;m.textContent=t}
  if(!APP.init()){$('bd').innerHTML=APP.setupHtml;return}
  $('mobile').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'')});
  $('f').addEventListener('submit',async function(e){
    e.preventDefault();
    var name=$('name').value.trim(),shop=$('shop').value.trim(),mobile=$('mobile').value.trim(),email=$('email').value.trim(),pw=$('pw').value;
    if(!/^[6-9]\d{9}$/.test(mobile))return show('Sahi 10 digit mobile number likhein.','err');
    if(pw.length<8)return show('Password kam se kam 8 akshar ka rakhein.','err');
    if(pw!==$('pw2').value)return show('Dono password ek jaise nahi hain.','err');
    var b=$('go');b.disabled=true;show('Account ban raha hai…','info');
    try{
      var r=await APP.sb.auth.signUp({email:email,password:pw,options:{data:{full_name:name,shop_name:shop,mobile:mobile},emailRedirectTo:location.origin+location.pathname.replace(/[^\/]*$/,'')+'login.html'}});
      if(r.error)throw r.error;
      if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)throw new Error('already registered');
      if(r.data&&r.data.session)await APP.sb.auth.signOut();
      $('f').reset();
      show('Registration ho gaya. Agar email confirm karne ka mail aaye to pehle use confirm karein. Phir admin aapka account approve karega, uske baad aap login kar sakenge.','ok');
    }catch(err){show(APP.err(err),'err')}
    b.disabled=false;
  });
})();
</script>
</body>
</html>
